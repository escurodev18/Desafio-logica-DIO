<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiência do herói</title>
    <script src="script.js" defer></script>
    <!--O dender diz ao navegador que primeiro deverá ser executado a página html antes mesmo do script-->
    <style>
        td,
        th {
            padding: 8px;
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <thead>
                <th>Experiência</th>
                <th>Faixa</th>
            </thead>


            <tbody>
                <tr>
                    <td>Menor ou igual a 1000</td>
                    <td>Ferro</td>
                </tr>
                <tr>
                    <td>Entre 1001 e 2000</td>
                    <td>Bronze</td>
                </tr>
                <tr>
                    <td>Entre 2001 e 5000</td>
                    <td>Prata</td>
                </tr>
                <tr>
                    <td>Entre 5001 e 6000</td>
                    <td>Ouro</td>
                </tr>
                <tr>
                    <td>Entre 6001 e 7000</td>
                    <td>Platina</td>
                </tr>
                <tr>
                    <td>Entre 7001 e 8000</td>
                    <td>Ascendente</td>
                </tr>
                <tr>
                    <td>Entre 8001 e 9000</td>
                    <td>Imortal</td>
                </tr>
                <tr>
                    <td>Maior ou igual 9001</td>
                    <td>Radiante</td>
                </tr>
            </tbody>
        </tr>
    </table>
    <h1>Experiência do herói</h1>
    <input type="text" name="nomeHeroi" id="nomeHeroi" placeholder="Nome do Herói ">
    <input type="number" name="xpHeroi" id="xpHeroi" placeholder="Experiência do herói">
    <input type="submit" id="send" value="enviar">

</body>

</html>
